name: Publish verified installers
on:
  push:
    branches: [main]
    paths: ['incoming/*.json']
permissions:
  contents: write
concurrency:
  group: public-installers
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/publish.py
      - name: Publish signed update feed
        run: |
          if git diff --quiet -- appcast.xml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appcast.xml
          git commit -m 'Publish verified signed Mac update feed'
          git pull --rebase origin main
          git push origin HEAD:main
